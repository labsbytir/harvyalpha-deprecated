<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Harvy Universal Search — Autonomous Dataset Intelligence</title>
  <meta name="description" content="Universal intelligence search across Harvy profiles, dockets, cases, posts, and forensic topology.">
  <link rel="stylesheet" href="/static/stylesheet.css">
  <script src="/static/saas-shell.js" defer></script>
  <script src="/static/auth-client.js?v=1" defer></script>
  <script src="/static/auth-modal.js?v=1" defer></script>
  <script src="/static/universal-search.js?v=8" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
</head>
<body class="search-page google-search-page">
  <div class="app-root">
    <!-- Minimal Google Mobile Style Top Bar (No busy multi-link desktop header) -->
    <div class="google-top-bar">
      <a href="/" class="google-back-btn" aria-label="Back to Harvy home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        <span>harvybot.com</span>
      </a>
      <span class="google-top-chip">HARVY SEARCH</span>
    </div>

    <main class="main-content universal-search-page">
      <div class="google-hero">
        <a href="/" class="google-logo-link" aria-label="HarvyBot home">
          <img src="/static/harvy-logo.png" alt="Harvy" class="google-hero-logo">
        </a>

        <!-- Frosted Glass Search Form -->
        <div class="glass-search-card frosted-glass">
          <form id="universal-search-form" autocomplete="off">
            <div class="search-input-row">
              <svg class="search-lens-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <label for="universal-search-query" class="sr-only">Search the archive</label>
              <input id="universal-search-query" class="glass-input" type="text" aria-label="Search all Harvy records" placeholder="Search targets, handles, dockets, cases, posts, or keywords..." required>
              <div class="glass-search-actions">
                <button type="button" id="adv-toggle" class="glass-btn-toggle" aria-expanded="false" aria-controls="adv-drawer">
                  <span>Filters</span>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
                <button type="submit" class="glass-submit-btn">Search</button>
              </div>
            </div>

            <!-- Category Filter Tabs -->
            <div class="search-tabs-row">
              <button type="button" class="tab-chip active" data-category="all">All Records</button>
              <button type="button" class="tab-chip" data-category="social">Social &amp; Profiles</button>
              <button type="button" class="tab-chip" data-category="posts">Extracted Posts</button>
              <button type="button" class="tab-chip" data-category="legal">Legal &amp; Dockets</button>
              <button type="button" class="tab-chip" data-category="geo">Geospatial</button>
            </div>

            <!-- Collapsible Advanced Drawer -->
            <div id="adv-drawer" class="advanced-filter-drawer">
              <div class="advanced-grid">
                <div class="adv-field">
                  <label for="adv-type" class="adv-label">DATASET SOURCE</label>
                  <select id="adv-type" class="adv-select">
                    <option value="all">Every Surface</option>
                    <option value="social">Profiles &amp; Bio Links</option>
                    <option value="posts">Timeline Artifacts</option>
                    <option value="legal">Courts &amp; Arrest Records</option>
                    <option value="geo">Street Level Coordinates</option>
                  </select>
                </div>
                <div class="adv-field">
                  <label for="adv-sort" class="adv-label">ORDER BY</label>
                  <select id="adv-sort" class="adv-select">
                    <option value="relevance">Relevance &amp; Match Density</option>
                    <option value="recent">Most Recent Ingestion</option>
                    <option value="alpha">Alphabetical / Identifier</option>
                  </select>
                </div>
                <div class="adv-field">
                  <label for="adv-scope" class="adv-label">ARCHIVE DEPTH</label>
                  <select id="adv-scope" class="adv-select">
                    <option value="full">Deep Archive + Basin Sink</option>
                    <option value="verified">Verified Dossiers Only</option>
                  </select>
                </div>
              </div>
            </div>
          </form>
        </div>

        <div class="search-suggestions">
          <button type="button" class="suggestion-tag">natgeo</button>
          <button type="button" class="suggestion-tag">trump</button>
          <button type="button" class="suggestion-tag">macron</button>
          <button type="button" class="suggestion-tag">zelenskyy</button>
          <button type="button" class="suggestion-tag">docket</button>
          <button type="button" class="suggestion-tag">instagram.com</button>
        </div>
      </div>

      <div id="universal-search-status" role="status" aria-live="polite"></div>
      <section id="universal-search-results" aria-label="Search results"></section>
    </main>
  </div>
</body>
</html>
