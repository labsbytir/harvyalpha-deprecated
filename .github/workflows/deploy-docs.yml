name: Deploy Documentation to Harvy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'notebooks/**'
      - 'v2/health/BASIN.md'
      - 'v2/scripts/sync_docs_repo.py'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Harvy Source
        uses: actions/checkout@v4
        with:
          path: harvy

      - name: Checkout Harvy Docs Repository
        uses: actions/checkout@v4
        with:
          repository: labsbytir/harvy-docs
          token: ${{ secrets.DOCS_REPO_TOKEN || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          path: harvy-docs

      - name: Sync Markdown Documentation
        run: |
          python3 harvy/v2/scripts/sync_docs_repo.py --dest harvy-docs

      - name: Commit and Push Changes to Docs Repository
        working-directory: harvy-docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --staged --quiet; then
            echo "No documentation changes detected to commit."
          else
            git commit -m "Sync documentation from harvy@${{ github.sha }}"
            git push origin main
            echo "Documentation synced to labsbytir/harvy-docs (triggers Cloudflare Pages build)."
          fi
