name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: python -m pip install -e . -r requirements.txt
      - run: npm ci
      - run: python -m unittest discover tests
      - run: npm run typecheck:platform-v2
      - run: npm run test:platform-v2
      - run: npm run test:auth-consent
      - run: npm run typecheck:auth
      - run: npm run typecheck:auth-client
      - run: npm run typecheck:query
